name: Publish to Maven Central Repository
on: workflow_dispatch

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
      - name: Set up Maven
        # Remove this pin once central-publishing supports Maven 3.10 without bundling local repository metadata.
        run: |
          maven_version=3.9.16
          archive="apache-maven-${maven_version}-bin.tar.gz"
          base_url="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${maven_version}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            --remote-name "${base_url}/${archive}" \
            --remote-name "${base_url}/${archive}.sha512"
          printf '%s  %s\n' "$(cat "${archive}.sha512")" "$archive" | sha512sum --check
          tar -xzf "$archive"
          echo "${RUNNER_TEMP}/apache-maven-${maven_version}/bin" >> "$GITHUB_PATH"
          echo "M2_HOME=${RUNNER_TEMP}/apache-maven-${maven_version}" >> "$GITHUB_ENV"
      - run: git config --global user.email "test@example.com"
      - run: git config --global user.name "Github Action"
      - name: Verify package
        run: mvn --show-version --batch-mode verify
      - name: Release package
        run: mvn --batch-mode -DskipTests=true releaser:release
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
